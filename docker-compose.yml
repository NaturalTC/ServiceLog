services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: servicelog
      POSTGRES_USER: servicelog
      POSTGRES_PASSWORD: servicelog
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  # Development-only email: catches every message the app sends.
  # Read them at http://localhost:8025. Nothing is delivered to real inboxes.
  mail:
    image: axllent/mailpit:v1.31.3
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox
volumes:
  db-data:
