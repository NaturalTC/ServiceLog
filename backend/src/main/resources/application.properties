spring.application.name=servicelog

# Database (defaults match docker-compose.yml; override with env vars in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/servicelog}
spring.datasource.username=${DB_USER:servicelog}
spring.datasource.password=${DB_PASSWORD:servicelog}

# Schema is owned by Flyway migrations in src/main/resources/db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
# An email outage shouldn't mark the whole app as down
management.health.mail.enabled=false

# Local settings (JWT_SECRET, OWNER_EMAIL, ...) can live in backend/.env, which is gitignored
spring.config.import=optional:file:.env[.properties]

# Auth
app.jwt.secret=${JWT_SECRET:}
# 12 hours: long enough for a work day in the field
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}
# Used once, on first startup, to create the owner's account (see OwnerAccountInitializer)
app.owner.email=${OWNER_EMAIL:}
app.owner.password=${OWNER_PASSWORD:}

# Email. Defaults point at Mailpit from docker-compose (inbox at http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:ServiceLog <no-reply@servicelog.local>}
# Where email links point (the React app)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
