# Tests use their own database so they can freely create and delete data
spring.datasource.url=jdbc:postgresql://localhost:5433/servicelog_test
app.jwt.secret=test-secret-that-is-at-least-32-bytes-long
# Don't pick up a developer's OWNER_EMAIL / OWNER_PASSWORD from backend/.env: tests create
# their own accounts, and the setup email would land in the middle of a test
app.owner.email=
app.owner.password=
